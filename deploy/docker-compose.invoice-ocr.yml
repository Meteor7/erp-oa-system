services:
  bench:
    depends_on:
      invoice-ocr:
        condition: service_healthy
    networks:
      - rayher
      - rayher-ocr-internal

  invoice-ocr:
    image: rayher/invoice-ocr:0.1.0
    build:
      context: ${INVOICE_OCR_BUILD_CONTEXT:-./.worktrees/invoice-ocr-reimbursement/services/invoice_ocr}
      target: runtime
    restart: unless-stopped
    volumes:
      - rayher-invoice-ocr-models:/models
    networks:
      - rayher-ocr-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=110).read()"
      interval: 30s
      timeout: 120s
      retries: 3
      start_period: 180s

networks:
  rayher-ocr-internal:
    name: rayher-ocr-internal
    internal: true

volumes:
  rayher-invoice-ocr-models:
    name: rayher-invoice-ocr-models
