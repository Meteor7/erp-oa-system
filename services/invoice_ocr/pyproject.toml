[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rayher-invoice-ocr"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "paddlepaddle==3.3.1",
    "paddleocr==3.7.0",
    "pydantic==2.11.7",
    "Pillow==13.0.0",
    "PyMuPDF==1.26.4",
    "numpy==2.2.6",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.1",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
filterwarnings = ["ignore:builtin type SwigPy.*:DeprecationWarning"]
